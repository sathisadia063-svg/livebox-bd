<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>LiveBox BD - Live TV Streaming</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root { 
  --bg:#0a0a0a; 
  --card:#1a1a1a; 
  --card2:#1e1e1e;
  --primary:#99f2e0; 
  --text:#fff; 
  --muted:#b3b3b3;
  --purple:#a78bfa;
}

* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; 
}

html, body {
  overflow-x: hidden;
  max-width: 100%;
  width: 100%;
}

body { 
  background: var(--bg); 
  color: var(--text); 
  min-height: 100vh;
}

/* ============================================
   HOME SCREEN
============================================ */
#home-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 30px 20px;
  background: 
    radial-gradient(circle at 15% -10%, rgba(153,242,224,0.15) 0, transparent 35%),
    radial-gradient(circle at 90% 5%, rgba(167,139,250,0.15) 0, transparent 30%),
    linear-gradient(145deg, #0a0a0a, #121212);
}

.home-logo {
  text-align: center;
  margin-bottom: 45px;
}

.home-logo-icon {
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, #99f2e0, #22d3ee);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: #000;
  font-weight: 900;
  margin: 0 auto 15px;
  box-shadow: 0 0 30px rgba(153,242,224,0.4);
}

.home-logo-title {
  font-size: 28px;
  font-weight: 800;
  color: #99f2e0;
  letter-spacing: -0.5px;
}

.home-logo-title span { color: #fff; }

.home-logo-sub {
  font-size: 11px;
  color: #888;
  margin-top: 6px;
  letter-spacing: 2px;
  font-weight: 500;
}

.home-cards {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
  max-width: 400px;
}

.home-card {
  background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
  border: 1px solid #2a2a2a;
  border-radius: 20px;
  padding: 35px 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.home-card:active { transform: scale(0.97); }
.home-card:hover {
  border-color: rgba(153,242,224,0.4);
  box-shadow: 0 8px 30px rgba(153,242,224,0.15);
}

.home-card-icon {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  font-size: 34px;
  transition: transform 0.3s;
}

.home-card:hover .home-card-icon { transform: scale(1.08); }

.card-livebox .home-card-icon {
  background: radial-gradient(circle, rgba(153,242,224,0.2) 0%, rgba(34,211,238,0.1) 70%, transparent 100%);
  color: #99f2e0;
  border: 2px solid rgba(153,242,224,0.3);
  box-shadow: 0 0 25px rgba(153,242,224,0.2);
}

.card-iptv .home-card-icon {
  background: radial-gradient(circle, rgba(167,139,250,0.2) 0%, rgba(139,92,246,0.1) 70%, transparent 100%);
  color: #a78bfa;
  border: 2px solid rgba(167,139,250,0.3);
  box-shadow: 0 0 25px rgba(167,139,250,0.2);
}

.home-card-title {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
}

.home-card-sub {
  font-size: 11px;
  color: #888;
  margin-top: 6px;
  letter-spacing: 0.5px;
}

/* ============================================
   CHANNEL PAGES
============================================ */
#livebox-page, #iptv-page {
  display: none;
  min-height: 100vh;
}

.page-header {
  display: flex;
  align-items: center;
  padding: 14px 12px;
  background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
  border-bottom: 1px solid rgba(153,242,224,0.2);
  position: sticky;
  top: 0;
  z-index: 60;
  gap: 12px;
}

#iptv-page .page-header { border-bottom-color: rgba(167,139,250,0.2); }

.back-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: #2a2a2a;
  border: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  color: #fff;
  flex-shrink: 0;
}
.back-btn:active { transform: scale(0.95); }

.page-title-wrap { flex: 1; min-width: 0; }

.page-title {
  font-size: 17px;
  font-weight: 700;
  color: #99f2e0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#iptv-page .page-title { color: #a78bfa; }

.page-subtitle {
  font-size: 10px;
  color: #888;
  margin-top: 2px;
  letter-spacing: 0.5px;
}

.channel-count {
  background: rgba(153,242,224,0.15);
  color: #99f2e0;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid rgba(153,242,224,0.3);
  flex-shrink: 0;
}

#iptv-page .channel-count {
  background: rgba(167,139,250,0.15);
  color: #a78bfa;
  border-color: rgba(167,139,250,0.3);
}

/* SEARCH */
.search-wrap {
  padding: 12px 10px 8px;
  background: #181818;
}
.search-input {
  width: 100%;
  padding: 11px 15px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #1e1e1e;
  color: #fff;
  font-size: 14px;
  outline: none;
}
.search-input::placeholder { color: #888; }
.search-input:focus { border-color: var(--primary); }
#iptv-page .search-input:focus { border-color: var(--purple); }

/* CATEGORY BAR */
.category-bar {
  display: flex;
  gap: 8px;
  padding: 8px 10px 12px;
  overflow-x: auto;
  scrollbar-width: none;
  background: #181818;
  border-bottom: 1px solid #2a2a2a;
  position: sticky;
  top: 66px;
  z-index: 55;
}
.category-bar::-webkit-scrollbar { display: none; }

.cat-btn {
  padding: 8px 16px;
  border-radius: 22px;
  background: #2a2a2a;
  color: #ddd;
  border: 1px solid #333;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.cat-btn.active {
  background: var(--primary);
  color: #000;
  border-color: var(--primary);
  font-weight: 700;
}

#iptv-page .cat-btn.active {
  background: var(--purple);
  border-color: var(--purple);
}

/* CHANNEL GRID */
.channel-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  padding: 12px 8px;
  width: 100%;
  overflow-x: hidden;
}
@media (min-width:600px){ 
  .channel-grid{ grid-template-columns:repeat(4, minmax(0, 1fr)); padding: 15px; gap: 10px; } 
}
@media (min-width:900px){ 
  .channel-grid{ grid-template-columns:repeat(6, minmax(0, 1fr)); padding: 20px; gap: 12px; } 
}

.channel-card {
  background: var(--card);
  border: 1px solid var(--primary);
  border-radius: 10px;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  min-width: 0;
  overflow: hidden;
}
.channel-card:active { transform: scale(0.95); }

#iptv-page .channel-card { border-color: var(--purple); }

.channel-logo {
  width: 55px;
  height: 55px;
  background: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 2px solid var(--primary);
  padding: 4px;
  flex-shrink: 0;
  position: relative;
}

#iptv-page .channel-logo { border-color: var(--purple); }

.channel-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  top: 0;
  left: 0;
  padding: 4px;
}

.channel-logo .initial-badge {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 18px;
  font-weight: 700;
  color: #fff;
  text-transform: uppercase;
}

.channel-name {
  font-size: 10px;
  text-align: center;
  color: var(--text);
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
  padding: 0 2px;
}

.empty-msg {
  grid-column: 1/-1;
  text-align: center;
  padding: 40px 20px;
  color: #888;
  font-size: 14px;
}

.site-footer {
  text-align: center;
  padding: 25px 15px;
  color: #666;
  font-size: 11px;
  border-top: 1px solid #2a2a2a;
  margin-top: 20px;
}
.site-footer b { color: #99f2e0; }

/* PLAYER MODAL */
#player-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.96);
  z-index: 100;
  flex-direction: column;
}
.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: var(--card2);
}
.player-header h2 { font-size: 15px; font-weight: 600; }
.close-player {
  font-size: 22px;
  color: #fff;
  cursor: pointer;
  padding: 0 10px;
}
.player-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}
.player-body video {
  width: 100%;
  max-height: 80vh;
  background: #000;
  border-radius: 8px;
}
.status {
  text-align: center;
  padding: 10px;
  color: var(--muted);
  font-size: 12px;
}

/* SERVER SELECTOR */
.server-bar {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  background: var(--card2);
  overflow-x: auto;
  scrollbar-width: none;
  flex-wrap: nowrap;
}
.server-bar::-webkit-scrollbar { display: none; }
.server-bar:empty { display: none; }

.server-btn {
  padding: 8px 16px;
  border-radius: 20px;
  background: #2a2a2a;
  color: #ddd;
  border: 1px solid #444;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.server-btn:active { transform: scale(0.95); }
.server-btn.active {
  background: var(--primary);
  color: #000;
  border-color: var(--primary);
}
</style>
</head>

// ============================================
// HTTP CHANNELS (IPTV Playlist) - EMPTY
// ============================================
const httpData = [];

// ============================================
// GLOBAL STATE
// ============================================
let cat1 = 'all';
let cat2 = 'all';
const $ = id => document.getElementById(id);
let hls = null;

// ============================================
// COLOR GENERATOR
// ============================================
function getColorFromName(name) {
  const colors = [
    '#e74c3c', '#e67e22', '#f39c12', '#f1c40f', '#2ecc71',
    '#27ae60', '#16a085', '#1abc9c', '#3498db', '#2980b9',
    '#9b59b6', '#8e44ad', '#e91e63', '#c0392b', '#d35400',
    '#d81b60', '#5e35b1', '#3949ab', '#1e88e5', '#00897b',
    '#43a047', '#7cb342', '#fb8c00', '#f4511e', '#6d4c41',
    '#546e7a', '#ff5722', '#795548', '#607d8b', '#9c27b0'
  ];
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  return colors[Math.abs(hash) % colors.length];
}

function getInitials(name) {
  const clean = name.replace(/[^a-zA-Z0-9 ]/g, '').trim();
  const words = clean.split(' ').filter(w => w);
  if (words.length >= 2) {
    return (words[0][0] + words[1][0]).toUpperCase();
  }
  return clean.substring(0, 2).toUpperCase() || 'TV';
}

// ============================================
// NAVIGATION
// ============================================
function openPage(pageId) {
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('livebox-page').style.display = 'none';
  document.getElementById('iptv-page').style.display = 'none';
  document.getElementById(pageId).style.display = 'block';
  window.scrollTo(0, 0);
  
  if (pageId === 'livebox-page') {
    cat1 = 'all';
    resetCatBtns('cat-bar-1');
    renderGrid(1);
  } else if (pageId === 'iptv-page') {
    cat2 = 'all';
    resetCatBtns('cat-bar-2');
    renderGrid(2);
  }
}

function goHome() {
  document.getElementById('livebox-page').style.display = 'none';
  document.getElementById('iptv-page').style.display = 'none';
  document.getElementById('home-screen').style.display = 'flex';
  window.scrollTo(0, 0);
}

function resetCatBtns(barId) {
  const bar = $(barId);
  if (!bar) return;
  bar.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  bar.querySelector('.cat-btn').classList.add('active');
}

// ============================================
// FILTER
// ============================================
function filterCat(page, cat, btn) {
  if (page === 1) { cat1 = cat; } else { cat2 = cat; }
  const barId = page === 1 ? 'cat-bar-1' : 'cat-bar-2';
  const bar = $(barId);
  bar.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const searchId = page === 1 ? 'search1' : 'search2';
  $(searchId).value = '';
  renderGrid(page);
}

// ============================================
// SEARCH
// ============================================
$('search1').addEventListener('input', () => renderGrid(1));
$('search2').addEventListener('input', () => renderGrid(2));

// ============================================
// RENDER
// ============================================
function renderGrid(page) {
  const srcData = page === 1 ? httpsData : httpData;
  const category = page === 1 ? cat1 : cat2;
  const searchId = page === 1 ? 'search1' : 'search2';
  const gridId = page === 1 ? 'grid1' : 'grid2';
  const countId = page === 1 ? 'count1' : 'count2';
  
  const query = $(searchId).value.toLowerCase().trim();
  
  const filtered = srcData.filter(c => {
    if (category !== 'all' && c.category !== category) return false;
    if (query && !c.name.toLowerCase().includes(query)) return false;
    return true;
  });
  
  $(countId).textContent = filtered.length;
  
  if (filtered.length === 0) {
    $(gridId).innerHTML = '<div class="empty-msg">No channels found</div>';
    return;
  }
  
  $(gridId).innerHTML = filtered.map(c => {
    const initials = getInitials(c.name);
    const color = getColorFromName(c.name);
    
    let logoContent;
    if (c.logo_url && c.logo_url.trim() !== '') {
      logoContent = `
        <img src="${c.logo_url}" alt="${c.name}" 
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
             loading="lazy">
        <div class="initial-badge" style="background:${color}; display:none;">${initials}</div>
      `;
    } else {
      logoContent = `<div class="initial-badge" style="background:${color};">${initials}</div>`;
    }
    
    return `
      <div class="channel-card" onclick="openChannel(${page}, ${c.id})">
        <div class="channel-logo">
          ${logoContent}
        </div>
        <div class="channel-name">${c.name}</div>
      </div>
    `;
  }).join('');
}

// ============================================
// PLAYER
// ============================================
function openChannel(page, id) {
  const srcData = page === 1 ? httpsData : httpData;
  const c = srcData.find(x => x.id === id);
  if (!c) return;

  $('player-title').textContent = c.name;
  $('player-modal').style.display = 'flex';
  $('status').textContent = 'Loading...';

  // Build server buttons
  const bar = $('server-bar');
  bar.innerHTML = '';
  if (c.streams && c.streams.length > 1) {
    c.streams.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.className = 'server-btn' + (i === 0 ? ' active' : '');
      btn.textContent = 'Server ' + (i + 1);
      btn.onclick = () => {
        bar.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        playStream(c.streams[i].url);
      };
      bar.appendChild(btn);
    });
  }

  const url = c.streams?.[0]?.url;
  if (!url) { 
    $('status').textContent = 'No stream URL found'; 
    return; 
  }
  playStream(url);
}

function playStream(url) {
  $('status').textContent = 'Loading...';
  if (hls) { hls.destroy(); hls = null; }

  const v = $('video');
  v.removeAttribute('src');
  v.load();

  if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = url;
    v.play().catch(() => {});
    $('status').textContent = 'Ready. Press Play.';
    return;
  }

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      manifestLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 3,
      levelLoadingMaxRetry: 3,
      fragLoadingMaxRetry: 3,
      maxBufferLength: 20,
      maxMaxBufferLength: 60,
    });
    hls.loadSource(url);
    hls.attachMedia(v);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      $('status').textContent = 'Ready. Press Play.';
      v.play().catch(() => {});
    });

    hls.on(Hls.Events.ERROR, (_, d) => {
      if (d.fatal) {
        $('status').textContent = 'Stream not available. Try another server.';
      }
    });
  } else {
    $('status').textContent = 'HLS not supported';
  }
}

function closePlayer() {
  if (hls) { hls.destroy(); hls = null; }
  const v = $('video');
  v.pause();
  v.removeAttribute('src');
  v.load();
  $('player-modal').style.display = 'none';
}
</script>
